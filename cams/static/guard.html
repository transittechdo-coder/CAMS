<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10202b">
<title>CAMS Guard</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">

<style>
  :root { --bg: #eef2f0; --card: #fff; --ink: #10202b; --ink2: #556877; --line: #d9e1e4; --teal: #0f6e6a; --red: #b3140f; --amber: #b8770a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1c27; --card: #15242f; --ink: #e3ecef; --ink2: #a9bcc6; --line: #25394a; --teal: #3bb3ad; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: 72px; }
  header { position: sticky; top: 0; z-index: 5; background: #10202b; color: #fff; display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
  header b { flex: 1; font-size: 17px; } header small { opacity: .75; }
  header button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.4); }
  main { padding: 12px 16px; max-width: 720px; margin: auto; }
  button { font: inherit; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); min-height: 42px; }
  button.primary { background: var(--teal); border-color: var(--teal); color: #fff; font-weight: 600; }
  button.danger { color: var(--red); }
  input { font: inherit; width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  nav { position: fixed; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav button { border: 0; border-radius: 0; background: none; padding: 10px 4px; font-size: 13px; min-height: 56px; color: var(--ink2); position: relative; }
  nav button[aria-current="page"] { color: var(--teal); font-weight: 700; box-shadow: inset 0 3px 0 var(--teal); }
  nav .count { position: absolute; top: 6px; right: calc(50% - 26px); background: var(--red); color: #fff; border-radius: 10px; font-size: 11px; padding: 0 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--ink2); font-size: 14px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: var(--line); }
  .tag.red { background: var(--red); color: #fff; } .tag.amber { background: var(--amber); color: #fff; }
  .alert img { width: 100%; border-radius: 6px; margin-top: 8px; }
  .alert img.face { width: 64px; height: 64px; object-fit: cover; margin: 0; }
  .cams { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .cam { background: #000; border-radius: 8px; overflow: hidden; position: relative; aspect-ratio: 16/9; border: 0; padding: 0; }
  .cam img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cam span { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; padding: 3px 6px; text-align: left; }
  .full { position: fixed; inset: 0; background: #000; z-index: 20; display: grid; grid-template-rows: auto 1fr; }
  .full .bar { display: flex; align-items: center; gap: 10px; padding: 10px; color: #fff; }
  .full img { width: 100%; height: 100%; object-fit: contain; }
  .em { position: fixed; inset: 0; z-index: 30; background: var(--red); color: #fff; overflow-y: auto; padding: 16px; animation: flash 1s steps(2, jump-none) infinite; }
  @keyframes flash { 50% { background: #7d0d0a; } }
  @media (prefers-reduced-motion: reduce) { .em { animation: none; } }
  .em h1 { margin: 6px 0 12px; font-size: 30px; letter-spacing: .05em; }
  .em .item { background: #fff; color: #1b1b1b; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .em img { width: 100%; border-radius: 6px; }
  .em button.ok { width: 100%; background: var(--red); color: #fff; border-color: var(--red); font-weight: 800; font-size: 18px; min-height: 52px; margin-top: 10px; }
  .em .mute { background: transparent; color: #fff; border-color: rgba(255,255,255,.6); }
  .login { max-width: 360px; margin: 12vh auto; }
  .login h1 { font-size: 26px; margin: 0 0 4px; }
  .err { color: var(--red); min-height: 1.4em; }
  .over { border-color: var(--red); box-shadow: inset 4px 0 0 var(--red); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/static/js/guard.js"></script>
</body>
</html>
