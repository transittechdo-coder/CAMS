name: Build Windows installer

# Runs the tests and builds CAMS-Setup.exe on GitHub's Windows machines.
# - Every push to main: the installer is attached to the workflow run (Actions tab -> run -> Artifacts).
# - A tag like v1.0.0: a GitHub Release is created with the installer attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The Android app (CAMS Guard) is built first: it goes inside CAMS so phones can install it
  # from the CAMS computer without internet, and it is attached to the release too.
  android:
    if: github.event_name != 'release'
    uses: ./.github/workflows/android.yml
    secrets: inherit

  build:
    needs: android
    if: always() && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pillow

      - name: Get the Android app (CAMS Guard)
        if: needs.android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: CAMS-Guard
          path: cams/static/app

      - name: Download face models
        run: python scripts/download_models.py

      - name: Run tests
        run: python -m pytest -q

      - name: Build CAMS.exe
        run: |
          python scripts/make_icon.py
          pyinstaller installer/cams.spec --noconfirm --distpath dist --workpath build

      - name: Smoke test the built program
        shell: pwsh
        run: |
          $env:CAMS_DATA_DIR = "$env:RUNNER_TEMP\camsdata"
          $p = Start-Process -FilePath dist\CAMS\CAMS.exe -ArgumentList "--no-window" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-RestMethod http://127.0.0.1:8765/api/status; if ($r.app -eq "CAMS" -and $r.models_ok) { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) {
            # show the end of the log as annotations so it is visible on the run's summary page
            $tail = Get-Content "$env:CAMS_DATA_DIR\logs\cams.log" -Tail 25 -ErrorAction SilentlyContinue
            if ($tail) { $tail | ForEach-Object { Write-Host "::error title=cams.log::$_" } } else { Write-Host "::error::No log file was written" }
            throw "CAMS.exe did not start"
          }
          Write-Host "CAMS.exe started and face models loaded"

      - name: Build installer
        shell: pwsh
        run: |
          $ver = python -c "import cams;print(cams.__version__)"
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer\cams.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem installer\Output

      - name: Install on a clean PC and check it is ready to use
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"
          function Fail($msg) {
            Write-Host "::error title=Install check::$msg"
            Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 25 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "::warning title=setup.log::$_" }
            Get-Content (Join-Path $env:APPDATA "CAMS\logs\cams.log") -Tail 15 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "::warning title=cams.log::$_" }
            exit 1
          }
          try {
            $setup = (Get-ChildItem installer\Output\*.exe | Select-Object -First 1).FullName
            Write-Host "Installing $setup with default choices, as a normal user install (no admin prompt)"
            $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Fail "Setup failed with code $($p.ExitCode)" }

            $app = Join-Path $env:LOCALAPPDATA "Programs\CAMS"
            $exe = Join-Path $app "CAMS.exe"
            if (-not (Test-Path $exe)) { Fail "CAMS.exe was not installed to $exe" }
            Write-Host "Installed to $app"

            $desk = [Environment]::GetFolderPath('Desktop')
            $lnk = Join-Path $desk "CAMS.lnk"
            if (-not (Test-Path $lnk)) { Fail "No CAMS icon on the desktop ($desk)" }
            $sh = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
            Write-Host "Desktop icon: $lnk -> $($sh.TargetPath)"
            if ($sh.TargetPath -ne $exe) { Fail "Desktop icon points to the wrong program: $($sh.TargetPath)" }

            $start = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\CAMS\CAMS.lnk"
            if (-not (Test-Path $start)) { Fail "No CAMS entry in the Start menu ($start)" }
            Write-Host "Start menu entry: $start"

            # Open CAMS from the desktop icon and wait until it answers
            Start-Process -FilePath $lnk
            $ok = $false
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 2
              try {
                $run = Get-Content (Join-Path $env:APPDATA "CAMS\running.json") -ErrorAction Stop | ConvertFrom-Json
                $r = Invoke-RestMethod "http://127.0.0.1:$($run.port)/api/status"
                if ($r.app -eq "CAMS" -and $r.models_ok -and $r.needs_setup -and $r.activity_ai.pose) { $ok = $true; break }
              } catch {}
            }
            Get-Process CAMS -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2
            if (-not $ok) { Fail "CAMS did not start from the desktop icon" }
            Write-Host "Opened from the desktop icon: face, object and body-pose AI loaded, first-run setup screen ready."

            # Check the CAMS window itself shows the screens
            $p = Start-Process -FilePath $exe -ArgumentList "--check-window" -PassThru
            if (-not $p.WaitForExit(150000)) {
              Write-Host "::warning title=Window check::CAMS --check-window did not exit within 150 s; stopping it"
              Get-Process CAMS -ErrorAction SilentlyContinue | Stop-Process -Force
            }
            Start-Sleep -Seconds 2
            $wc = Get-Content (Join-Path $env:APPDATA "CAMS\window_check.json") -ErrorAction SilentlyContinue | ConvertFrom-Json
            Write-Host "Window check: ok=$($wc.ok) mode=$($wc.mode)"
            if (-not $wc.ok) { Fail "The CAMS window did not show its screens (mode: $($wc.mode))" }
            "### CAMS install check`n- Installed without admin rights to ``$app```n- Desktop icon and Start menu entry present`n- Started from the desktop icon with AI models loaded`n- Window mode: **$($wc.mode)**" | Out-File $env:GITHUB_STEP_SUMMARY -Append

            # Uninstall and check it cleans up
            Get-Process CAMS, msedgewebview2 -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$app*" -or $_.ProcessName -eq "CAMS" } | Stop-Process -Force -ErrorAction SilentlyContinue
            $u = Start-Process -FilePath (Join-Path $app "unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
            if (-not $u.WaitForExit(120000)) { Fail "Uninstall did not finish within 2 minutes" }
            for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
            if (Test-Path $exe) { Fail "Uninstall did not remove CAMS.exe" }
            if (Test-Path $lnk) { Fail "Uninstall left the desktop icon behind" }
            Write-Host "Uninstall removed the program and icons."
          } catch {
            Fail "$($_.Exception.Message) at line $($_.InvocationInfo.ScriptLineNumber)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: CAMS-Setup
          path: installer/Output/*.exe
          retention-days: 30

      # Every tested build on main is published as a GitHub Release, so the
      # website's Download button (releases/latest/download/CAMS-Setup.exe)
      # always gives the newest installer that passed every check above.
      - name: Publish release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ver = python -c "import cams;print(cams.__version__)"
          $tag = if ("${{ github.event.release.tag_name }}") { "${{ github.event.release.tag_name }}" } elseif ("${{ github.ref }}".StartsWith("refs/tags/")) { "${{ github.ref_name }}" } else { "v$ver" }
          $versioned = (Get-ChildItem installer/Output/*.exe | Select-Object -First 1).FullName
          $stable = Join-Path (Split-Path $versioned) "CAMS-Setup.exe"
          Copy-Item $versioned $stable -Force
          $notes = @"
          CAMS $ver for Windows 10 and 11 (64-bit).

          **Download CAMS-Setup.exe**, double-click it and follow the steps. No administrator rights and no internet are needed. CAMS opens at the end and puts an icon on your desktop.

          If Windows shows "Windows protected your PC", click **More info** then **Run anyway** (the installer is not code-signed).

          **CAMS-Guard.apk** is the Android app for guards' phones. You do not need to download it here: phones get it from the CAMS computer (Settings, Phones, Add a phone).

          Built and tested automatically from commit ${{ github.sha }}.
          "@
          $apk = @(Get-ChildItem cams/static/app/CAMS-Guard.apk -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $versioned $stable @apk --clobber
          } else {
            gh release create $tag $versioned $stable @apk --title "CAMS $ver" --notes $notes --latest --target ${{ github.sha }}
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the release" }
          Write-Host "Published $tag"

  # Runs build.bat exactly as a person would (double-click), then checks that
  # CAMS got installed, has a desktop icon and is open at the end.
  build-bat:
    runs-on: windows-latest
    timeout-minutes: 30
    if: github.event_name != 'release'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # One step: GitHub stops programs started in a step when that step ends,
      # so CAMS (opened by build.bat) must be checked in the same step.
      - name: Run build.bat and check CAMS is installed, on the desktop and open
        shell: pwsh
        run: |
          cmd /c build.bat
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=build.bat::build.bat failed"; exit 1 }
          function Fail($msg) {
            Write-Host "::error title=build.bat check::$msg"
            Get-Content (Join-Path $env:APPDATA "CAMS\logs\cams.log") -Tail 15 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "::warning title=cams.log::$_" }
            exit 1
          }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\CAMS\CAMS.exe"
          if (-not (Test-Path $exe)) { Fail "build.bat did not install CAMS" }
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) "CAMS.lnk"
          if (-not (Test-Path $lnk)) { Fail "build.bat left no CAMS icon on the desktop" }
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            try {
              $run = Get-Content (Join-Path $env:APPDATA "CAMS\running.json") -ErrorAction Stop | ConvertFrom-Json
              $r = Invoke-RestMethod "http://127.0.0.1:$($run.port)/api/status"
              if ($r.app -eq "CAMS" -and $r.models_ok) { $ok = $true; break }
            } catch {}
          }
          if (-not $ok) { Fail "CAMS was not open after build.bat finished" }
          $loads = 0
          for ($i = 0; $i -lt 20 -and $loads -lt 1; $i++) {
            Start-Sleep -Seconds 2
            $loads = (Invoke-RestMethod "http://127.0.0.1:$($run.port)/api/status").ui_loads
          }
          Get-Process CAMS -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($loads -lt 1) { Fail "CAMS started but its window never showed the screens" }
          Write-Host "build.bat installed CAMS, made the desktop icon and opened the CAMS window."
