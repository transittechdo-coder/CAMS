name: Build Windows installer

# Runs the tests and builds CAMS-Setup.exe on GitHub's Windows machines.
# - Every push to main: the installer is attached to the workflow run (Actions tab -> run -> Artifacts).
# - A tag like v1.0.0: a GitHub Release is created with the installer attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pillow

      - name: Download face models
        run: python scripts/download_models.py

      - name: Run tests
        run: python -m pytest -q

      - name: Build CAMS.exe
        run: |
          python scripts/make_icon.py
          pyinstaller installer/cams.spec --noconfirm --distpath dist --workpath build

      - name: Smoke test the built program
        shell: pwsh
        run: |
          $env:CAMS_DATA_DIR = "$env:RUNNER_TEMP\camsdata"
          $p = Start-Process -FilePath dist\CAMS\CAMS.exe -ArgumentList "--no-window" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-RestMethod http://127.0.0.1:8765/api/status; if ($r.app -eq "CAMS" -and $r.models_ok) { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) {
            # show the end of the log as annotations so it is visible on the run's summary page
            $tail = Get-Content "$env:CAMS_DATA_DIR\logs\cams.log" -Tail 25 -ErrorAction SilentlyContinue
            if ($tail) { $tail | ForEach-Object { Write-Host "::error title=cams.log::$_" } } else { Write-Host "::error::No log file was written" }
            throw "CAMS.exe did not start"
          }
          Write-Host "CAMS.exe started and face models loaded"

      - name: Build installer
        shell: pwsh
        run: |
          $ver = python -c "import cams;print(cams.__version__)"
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer\cams.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem installer\Output

      - name: Install on a clean PC and check it is ready to use
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer\Output\*.exe | Select-Object -First 1).FullName
          Write-Host "Installing $setup silently (default choices)"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40; throw "Setup failed with code $($p.ExitCode)" }

          $exe = Join-Path $env:ProgramFiles "CAMS\CAMS.exe"
          if (-not (Test-Path $exe)) { throw "CAMS.exe was not installed to $exe" }

          # The desktop icon must exist (all-users desktop, or the user's own as a fallback)
          $links = @("$env:PUBLIC\Desktop\CAMS.lnk", "$([Environment]::GetFolderPath('Desktop'))\CAMS.lnk") | Where-Object { Test-Path $_ }
          if (-not $links) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40; throw "No CAMS icon on the desktop" }
          $lnk = $links[0]
          Write-Host "Desktop icon found: $lnk"
          $sh = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          Write-Host "  points to: $($sh.TargetPath)  icon: $($sh.IconLocation)"
          if ($sh.TargetPath -ne $exe) { throw "Desktop icon points to the wrong program: $($sh.TargetPath)" }

          $start = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\CAMS\CAMS.lnk"
          if (-not (Test-Path $start)) { throw "No CAMS entry in the Start menu" }
          Write-Host "Start menu entry found: $start"

          # Double-click the desktop icon (open the shortcut) and wait until CAMS answers
          Get-Process CAMS -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Process -FilePath $lnk
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-RestMethod http://127.0.0.1:8765/api/status
              if ($r.app -eq "CAMS" -and $r.models_ok -and $r.needs_setup) { $ok = $true; break }
            } catch {}
          }
          $page = $null
          if ($ok) { $page = (Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing).StatusCode }
          Get-Process CAMS -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok -or $page -ne 200) {
            $log = Join-Path $env:APPDATA "CAMS\logs\cams.log"
            Get-Content $log -Tail 25 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "::error title=cams.log::$_" }
            throw "CAMS did not start from the desktop icon"
          }
          Write-Host "CAMS started from the desktop icon, AI models loaded, first-run setup screen is ready."

          # Uninstall cleanly
          $un = Join-Path $env:ProgramFiles "CAMS\unins000.exe"
          Start-Process -FilePath $un -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          if (Test-Path "$env:PUBLIC\Desktop\CAMS.lnk") { throw "Uninstall left the desktop icon behind" }
          Write-Host "Uninstall removed the program and icons."

      - uses: actions/upload-artifact@v4
        with:
          name: CAMS-Setup
          path: installer/Output/*.exe
          retention-days: 30

      - name: Publish release
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        shell: pwsh
        run: |
          $files = Get-ChildItem installer/Output/*.exe | ForEach-Object { $_.FullName }
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            # release was created on github.com: just attach the installer
            gh release upload $env:TAG $files --clobber
          } else {
            gh release create $env:TAG $files --title "CAMS $env:TAG" --notes "Download CAMS-Setup and run it on Windows 10 or 11 (64-bit). See docs/USER_GUIDE.md."
          }
