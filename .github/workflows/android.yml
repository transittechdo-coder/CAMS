name: Android app

# Builds CAMS Guard (android/) into CAMS-Guard.apk. Runs on pull requests, and is called by
# "Build Windows installer", which puts the app inside CAMS and attaches it to the release.
on:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_call:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build CAMS Guard
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          CAMS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ver=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('../cams/__init__.py').read()).group(1))")
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cams-guard.jks"
            export CAMS_KEYSTORE="$RUNNER_TEMP/cams-guard.jks"
          else
            echo "::warning::No signing key in the secrets ANDROID_KEYSTORE / ANDROID_KEYSTORE_PASSWORD: using the TEST key in android/test-signing.jks. Fine for testing; add the real key before giving the app to customers."
            export CAMS_KEYSTORE="$PWD/test-signing.jks"
            export CAMS_KEYSTORE_PASSWORD="camsguard-test"
          fi
          gradle assembleRelease -PcamsVersion="$ver" --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../CAMS-Guard.apk
          ls -la ../CAMS-Guard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CAMS-Guard
          path: CAMS-Guard.apk
          retention-days: 30
